<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Algebra 1 Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg0: #0a0b0e;
    --bg1: #111318;
    --bg2: #181c24;
    --bg3: #1e2330;
    --border: #2a3040;
    --border2: #3a4460;
    --accent: #4f8ef7;
    --accent2: #7c5cf6;
    --green: #2dd87e;
    --yellow: #f5c518;
    --red: #f05a5a;
    --text0: #e8eaf0;
    --text1: #9ba3b8;
    --text2: #5a6278;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
    --radius: 10px;
    --radius-lg: 16px;
  }

  body {
    background: var(--bg0);
    color: var(--text0);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .logo-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 0.5rem;
  }

  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 18px;
    color: #fff;
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #e8eaf0 0%, #9ba3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 0.88rem;
    color: var(--text2);
    letter-spacing: 0.04em;
    margin-top: 0.3rem;
  }

  .solver-card {
    width: 100%;
    max-width: 720px;
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .input-area {
    padding: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .input-label {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
  }

  #eq-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    font-family: var(--mono);
    font-size: 1.05rem;
    color: var(--text0);
    outline: none;
    transition: border-color 0.15s;
  }

  #eq-input:focus { border-color: var(--accent); }
  #eq-input::placeholder { color: var(--text2); }

  #solve-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 1.4rem;
    font-family: var(--sans);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  #solve-btn:hover { opacity: 0.88; }
  #solve-btn:active { transform: scale(0.97); }

  .examples-row {
    margin-top: 0.75rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }

  .ex-chip {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.65rem;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text1);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    user-select: none;
  }

  .ex-chip:hover { border-color: var(--accent); color: var(--accent); }

  .result-area {
    padding: 1.5rem;
    min-height: 120px;
  }

  .result-placeholder {
    color: var(--text2);
    font-size: 0.9rem;
    text-align: center;
    padding: 2rem 0;
  }

  .result-block {
    display: none;
  }

  .result-block.visible { display: block; }

  .result-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.7rem;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text1);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .result-type-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
  }

  .steps-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .step-item {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
  }

  .step-num {
    min-width: 22px; height: 22px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text2);
    margin-top: 2px;
    flex-shrink: 0;
  }

  .step-text {
    font-size: 0.92rem;
    color: var(--text1);
    line-height: 1.55;
  }

  .step-math {
    font-family: var(--mono);
    color: var(--text0);
  }

  .answer-box {
    margin-top: 1.25rem;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .answer-label {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .answer-value {
    font-family: var(--mono);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--green);
  }

  .copy-answer-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.65rem;
    font-size: 0.78rem;
    color: var(--text1);
    cursor: pointer;
    font-family: var(--sans);
    transition: color 0.15s, border-color 0.15s;
  }

  .copy-answer-btn:hover { color: var(--accent); border-color: var(--accent); }

  .error-box {
    background: rgba(240,90,90,0.08);
    border: 1px solid rgba(240,90,90,0.3);
    border-radius: var(--radius);
    padding: 0.85rem 1.1rem;
    font-size: 0.9rem;
    color: var(--red);
    display: none;
  }

  .error-box.visible { display: block; }

  /* Spinner */
  .spinner {
    display: none;
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg1);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 1.75rem;
    max-width: 480px;
    width: 100%;
    animation: modal-in 0.18s ease;
  }

  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }

  .modal .modal-sub {
    font-size: 0.85rem;
    color: var(--text1);
    margin-bottom: 1.2rem;
    line-height: 1.5;
  }

  .modal .eq-preview {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--accent);
    margin-bottom: 1.2rem;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
  }

  .option-check {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s;
    user-select: none;
  }

  .option-check:hover { border-color: var(--accent); }
  .option-check.selected { border-color: var(--accent); background: rgba(79,142,247,0.1); }

  .option-check input[type=checkbox] { display: none; }

  .check-box {
    width: 16px; height: 16px;
    border: 1.5px solid var(--border2);
    border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, border-color 0.12s;
  }

  .option-check.selected .check-box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check-box svg { display: none; }
  .option-check.selected .check-box svg { display: block; }

  .option-label {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text1);
  }

  .option-check.selected .option-label { color: var(--text0); }

  .modal-actions {
    display: flex;
    gap: 0.5rem;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 1rem;
    font-family: var(--sans);
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--text1);
    cursor: pointer;
    transition: color 0.12s;
  }

  .btn-cancel:hover { color: var(--text0); }

  .btn-solve-modal {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 8px;
    padding: 0.55rem 1.2rem;
    font-family: var(--sans);
    font-size: 0.88rem;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.12s;
  }

  .btn-solve-modal:hover { opacity: 0.88; }

  /* History */
  .history-section {
    width: 100%;
    max-width: 720px;
    margin-top: 1.5rem;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.6rem;
  }

  .history-title {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text2);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .clear-history-btn {
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 0.78rem;
    color: var(--text2);
    cursor: pointer;
    transition: color 0.12s;
  }

  .clear-history-btn:hover { color: var(--red); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .history-item {
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    cursor: pointer;
    transition: border-color 0.12s;
  }

  .history-item:hover { border-color: var(--border2); }

  .history-eq {
    font-family: var(--mono);
    font-size: 0.88rem;
    color: var(--text1);
  }

  .history-ans {
    font-family: var(--mono);
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--green);
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div class="logo-bar">
    <div class="logo-icon">f(x)</div>
    <h1>Algebra 1 Solver</h1>
  </div>
  <p class="subtitle">Step-by-step solutions · Any Algebra 1 problem</p>
</header>

<div class="solver-card">
  <div class="input-area">
    <div class="input-label">Enter your problem</div>
    <div class="input-row">
      <input id="eq-input" type="text" placeholder="e.g.  2x + 5 = 13  or  x² - 9 = 0" autocomplete="off" spellcheck="false" />
      <button id="solve-btn" onclick="handleSolve()">Solve →</button>
    </div>
    <div class="examples-row" id="examples-row"></div>
  </div>
  <div class="result-area">
    <div class="result-placeholder" id="placeholder">Enter a problem above and press Solve.</div>
    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="error-box"></div>
    <div class="result-block" id="result-block">
      <div class="result-type-badge"><span class="dot"></span><span id="result-type-label">Linear Equation</span></div>
      <ul class="steps-list" id="steps-list"></ul>
      <div class="answer-box">
        <div>
          <div class="answer-label">Answer</div>
          <div class="answer-value" id="answer-value"></div>
        </div>
        <button class="copy-answer-btn" onclick="copyAnswer()">Copy</button>
      </div>
    </div>
  </div>
</div>

<div class="history-section" id="history-section" style="display:none;">
  <div class="history-header">
    <span class="history-title">Recent Problems</span>
    <button class="clear-history-btn" onclick="clearHistory()">Clear all</button>
  </div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- Ambiguity Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>What should I do with this?</h2>
    <p class="modal-sub">I couldn't automatically identify the problem type. Select what you'd like me to do:</p>
    <div class="eq-preview" id="modal-eq-preview"></div>
    <div class="options-grid" id="options-grid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-solve-modal" onclick="solveWithChoices()">Solve →</button>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  '2x + 5 = 13',
  'x² - 5x + 6 = 0',
  '3(x - 2) = 15',
  '|2x - 4| = 8',
  'y = 2x + 3',
  '2x + y = 10, x - y = 2',
  'x/3 + 4 = 7',
  '√(x + 4) = 5',
  'x² = 49',
  '4x - 2 > 10'
];

const MODAL_OPTIONS = [
  { id: 'solve', label: 'Solve for x' },
  { id: 'simplify', label: 'Simplify' },
  { id: 'factor', label: 'Factor' },
  { id: 'expand', label: 'Expand' },
  { id: 'graph', label: 'Find slope/intercept' },
  { id: 'system', label: 'Solve as system' },
  { id: 'inequality', label: 'Solve inequality' },
  { id: 'evaluate', label: 'Evaluate expression' },
];

let history = JSON.parse(localStorage.getItem('alg1_history') || '[]');
let selectedModalOptions = new Set();
let currentInput = '';

// Build examples chips
const row = document.getElementById('examples-row');
EXAMPLES.forEach(ex => {
  const chip = document.createElement('span');
  chip.className = 'ex-chip';
  chip.textContent = ex;
  chip.onclick = () => {
    document.getElementById('eq-input').value = ex;
    handleSolve();
  };
  row.appendChild(chip);
});

// Build modal options
const grid = document.getElementById('options-grid');
MODAL_OPTIONS.forEach(opt => {
  const label = document.createElement('label');
  label.className = 'option-check';
  label.dataset.id = opt.id;
  label.innerHTML = `
    <input type="checkbox" value="${opt.id}" />
    <div class="check-box"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <span class="option-label">${opt.label}</span>`;
  label.onclick = (e) => {
    e.preventDefault();
    label.classList.toggle('selected');
    if (label.classList.contains('selected')) selectedModalOptions.add(opt.id);
    else selectedModalOptions.delete(opt.id);
  };
  grid.appendChild(label);
});

document.getElementById('eq-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSolve();
});

function showError(msg) {
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('result-block').classList.remove('visible');
  const eb = document.getElementById('error-box');
  eb.textContent = msg;
  eb.classList.add('visible');
}

function showResult(typeLabel, steps, answer) {
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('error-box').classList.remove('visible');
  document.getElementById('result-type-label').textContent = typeLabel;
  const ul = document.getElementById('steps-list');
  ul.innerHTML = '';
  steps.forEach((step, i) => {
    const li = document.createElement('li');
    li.className = 'step-item';
    li.innerHTML = `<div class="step-num">${i+1}</div><div class="step-text">${step}</div>`;
    ul.appendChild(li);
  });
  document.getElementById('answer-value').textContent = answer;
  document.getElementById('result-block').classList.add('visible');
  addHistory(currentInput, answer);
}

function showSpinner() {
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('error-box').classList.remove('visible');
  document.getElementById('result-block').classList.remove('visible');
  document.getElementById('spinner').style.display = 'block';
}

function handleSolve() {
  const raw = document.getElementById('eq-input').value.trim();
  if (!raw) return;
  currentInput = raw;
  showSpinner();
  setTimeout(() => {
    try {
      const result = solveAuto(raw);
      if (result === 'AMBIGUOUS') {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('placeholder').style.display = 'none';
        openModal(raw);
      } else {
        showResult(result.type, result.steps, result.answer);
      }
    } catch(e) {
      showError('Could not parse: ' + e.message);
    }
  }, 220);
}

// ─── CORE SOLVER ENGINE ──────────────────────────────────────────────────────

function solveAuto(raw) {
  const s = raw.trim();

  // System of equations (comma or line separated)
  if (/,|\n|;/.test(s) && s.includes('=')) return solveSystem(s);

  // Inequality
  if (/[<>]/.test(s)) return solveInequality(s);

  // Absolute value equation
  if (/\|/.test(s) && s.includes('=')) return solveAbsValue(s);

  // Equation (has =)
  if (s.includes('=')) {
    // Quadratic?
    if (/x\^?2|x²/.test(s)) return solveQuadratic(s);
    // Linear with square root
    if (/sqrt|√/.test(s)) return solveSqrt(s);
    // Linear
    if (/x/.test(s)) return solveLinear(s);
    // Numeric equation
    return evaluateNumeric(s);
  }

  // Expression with no = — simplify/evaluate
  if (/x/.test(s)) return 'AMBIGUOUS';
  return evaluateExpression(s);
}

// ─── Tokenizer / basic math eval ─────────────────────────────────────────────
function evalMath(expr) {
  // Safe evaluator for numeric expressions
  const cleaned = expr
    .replace(/\^/g, '**')
    .replace(/√\s*\(([^)]+)\)/g, 'Math.sqrt($1)')
    .replace(/√(\d+(\.\d+)?)/g, 'Math.sqrt($1)')
    .replace(/sqrt\s*\(([^)]+)\)/gi, 'Math.sqrt($1)')
    .replace(/abs\s*\(([^)]+)\)/gi, 'Math.abs($1)');
  // eslint-disable-next-line no-new-func
  return Function('"use strict"; return (' + cleaned + ')')();
}

function fmtNum(n) {
  if (!isFinite(n)) return 'undefined';
  const r = Math.round(n * 1e10) / 1e10;
  if (Number.isInteger(r)) return String(r);
  // Try to express as fraction
  const frac = toFraction(r);
  if (frac) return frac;
  return r.toFixed(4).replace(/\.?0+$/, '');
}

function toFraction(decimal) {
  if (Math.abs(decimal) > 1000) return null;
  for (let den = 2; den <= 100; den++) {
    const num = Math.round(decimal * den);
    if (Math.abs(num / den - decimal) < 1e-9) {
      if (Math.abs(num) === Math.abs(den)) return null;
      return num + '/' + den;
    }
  }
  return null;
}

// ─── Linear solver ax + b = cx + d ──────────────────────────────────────────
function parseLinear(expr) {
  // returns {a, b} for ax + b
  let e = expr.replace(/\s/g,'')
    .replace(/²/g,'^2')
    .replace(/\*\*2/g,'^2');
  // normalize
  e = e.replace(/([+-])x/g,'$11x').replace(/^x/,'1x').replace(/([+\-*/\(])x/g,'$11x');
  let a = 0, b = 0;
  const tokens = e.match(/[+-]?[^+-]+/g) || [];
  tokens.forEach(tok => {
    tok = tok.replace(/\s/g,'');
    if (!tok) return;
    if (/x/.test(tok)) {
      const coeff = tok.replace('x','') || '1';
      a += coeff === '' || coeff === '+' ? 1 : coeff === '-' ? -1 : parseFloat(coeff);
    } else {
      b += parseFloat(tok) || 0;
    }
  });
  return {a, b};
}

function solveLinear(raw) {
  // handle parentheses expansion first
  let s = raw.replace(/\s/g,'');
  // expand simple k(ax+b)
  s = expandParens(s);

  const sides = s.split('=');
  if (sides.length !== 2) throw new Error('Invalid equation');
  const L = parseLinear(sides[0]);
  const R = parseLinear(sides[1]);
  const a = L.a - R.a;
  const b = R.b - L.b;

  const steps = [
    `Start with: <span class="step-math">${raw}</span>`,
    `Move all <span class="step-math">x</span> terms to the left and constants to the right`,
    `Equation becomes: <span class="step-math">${fmtNum(a)}x = ${fmtNum(b)}</span>`,
    `Divide both sides by <span class="step-math">${fmtNum(a)}</span>`,
    `<span class="step-math">x = ${fmtNum(b)}÷${fmtNum(a)} = ${fmtNum(b/a)}</span>`,
  ];

  if (a === 0) {
    if (Math.abs(b) < 1e-9) return { type: 'Identity', steps: ['Both sides are equal for all x.'], answer: 'All real numbers' };
    return { type: 'No Solution', steps: ['The equation has no solution.'], answer: 'No solution' };
  }

  return { type: 'Linear Equation', steps, answer: 'x = ' + fmtNum(b/a) };
}

function expandParens(s) {
  // expand k*(ax+b) or k(ax+b)
  return s.replace(/([+-]?[\d.]*)\*?\(([^)]+)\)/g, (m, k, inner) => {
    const coeff = k === '' || k === '+' ? 1 : k === '-' ? -1 : parseFloat(k);
    return inner.replace(/([+-]?[\d.]*x?(?:\^2)?)/g, tok => {
      if (!tok) return '';
      const n = parseFloat(tok) || (tok.includes('x') ? (tok.replace(/[x\+\-\^2]/g,'') === '' ? 1 : parseFloat(tok.replace('x',''))||1) : 0);
      return tok.includes('x') ? (coeff * (parseFloat(tok.replace('x',''))||1)) + 'x' : (coeff * parseFloat(tok));
    });
  });
}

// ─── Quadratic ───────────────────────────────────────────────────────────────
function solveQuadratic(raw) {
  let s = raw.replace(/\s/g,'').replace(/²/g,'^2').replace(/x\^2/g,'X2');
  const sides = s.split('=');
  if (sides.length !== 2) throw new Error('Need = sign');

  // move everything to left: ax²+bx+c=0
  function parsePoly(expr) {
    let e = expr.replace(/X2/g,'x^2');
    let a2=0, a1=0, a0=0;
    const terms = (e.match(/[+-]?[^+-]+/g)||[]);
    terms.forEach(t => {
      t = t.trim();
      if (!t) return;
      if (t.includes('x^2')) {
        const c = t.replace('x^2',''); a2 += c===''||c==='+'?1:c==='-'?-1:parseFloat(c)||1;
      } else if (t.includes('x')) {
        const c = t.replace('x',''); a1 += c===''||c==='+'?1:c==='-'?-1:parseFloat(c)||1;
      } else {
        a0 += parseFloat(t)||0;
      }
    });
    return {a2,a1,a0};
  }

  const L = parsePoly(sides[0].replace(/X2/g,'x^2'));
  const R = parsePoly(sides[1].replace(/X2/g,'x^2'));
  const a = L.a2 - R.a2, b = L.a1 - R.a1, c = L.a0 - R.a0;

  const disc = b*b - 4*a*c;
  const steps = [
    `Start with: <span class="step-math">${raw}</span>`,
    `Standard form: <span class="step-math">${fmtNum(a)}x² + ${fmtNum(b)}x + ${fmtNum(c)} = 0</span>`,
    `Use quadratic formula: <span class="step-math">x = (−b ± √(b²−4ac)) / 2a</span>`,
    `Discriminant: <span class="step-math">b²−4ac = ${fmtNum(b*b)} − ${fmtNum(4*a*c)} = ${fmtNum(disc)}</span>`,
  ];

  let answer;
  if (disc < 0) {
    steps.push(`Discriminant is negative → <strong>no real solutions</strong>`);
    answer = 'No real solutions';
  } else if (disc === 0) {
    const x = -b / (2*a);
    steps.push(`Discriminant = 0 → one repeated root`);
    steps.push(`<span class="step-math">x = ${fmtNum(-b)} / ${fmtNum(2*a)} = ${fmtNum(x)}</span>`);
    answer = 'x = ' + fmtNum(x);
  } else {
    const x1 = (-b + Math.sqrt(disc)) / (2*a);
    const x2 = (-b - Math.sqrt(disc)) / (2*a);
    steps.push(`√discriminant = √${fmtNum(disc)} = ${fmtNum(Math.sqrt(disc))}`);
    steps.push(`<span class="step-math">x₁ = (${fmtNum(-b)} + ${fmtNum(Math.sqrt(disc))}) / ${fmtNum(2*a)} = ${fmtNum(x1)}</span>`);
    steps.push(`<span class="step-math">x₂ = (${fmtNum(-b)} − ${fmtNum(Math.sqrt(disc))}) / ${fmtNum(2*a)} = ${fmtNum(x2)}</span>`);
    answer = `x₁ = ${fmtNum(x1)},  x₂ = ${fmtNum(x2)}`;
  }

  return { type: 'Quadratic Equation', steps, answer };
}

// ─── Absolute Value ───────────────────────────────────────────────────────────
function solveAbsValue(raw) {
  const m = raw.match(/\|([^|]+)\|\s*=\s*(.+)/);
  if (!m) throw new Error('Could not parse absolute value');
  const inner = m[1].trim(), rhs = parseFloat(m[2].trim());
  const steps = [
    `Start with: <span class="step-math">${raw}</span>`,
    `|expression| = k means expression = k or expression = −k`,
    `Case 1: <span class="step-math">${inner} = ${fmtNum(rhs)}</span>`,
    `Case 2: <span class="step-math">${inner} = ${fmtNum(-rhs)}</span>`,
  ];

  function solveSimpleLinear(eq) {
    const sides = eq.split('=');
    if (sides.length !== 2) return null;
    const L = parseLinear(sides[0]), R = parseLinear(sides[1]);
    const a = L.a - R.a, b = R.b - L.b;
    return a !== 0 ? b/a : null;
  }

  const x1 = solveSimpleLinear(`${inner}=${fmtNum(rhs)}`);
  const x2 = solveSimpleLinear(`${inner}=${fmtNum(-rhs)}`);

  if (rhs < 0) {
    steps.push('Right side is negative → no solution (absolute value is always ≥ 0)');
    return { type: 'Absolute Value Equation', steps, answer: 'No solution' };
  }

  steps.push(`Solve Case 1: x = ${fmtNum(x1)}`);
  steps.push(`Solve Case 2: x = ${fmtNum(x2)}`);

  return {
    type: 'Absolute Value Equation',
    steps,
    answer: x1 === x2 ? `x = ${fmtNum(x1)}` : `x = ${fmtNum(x1)}  or  x = ${fmtNum(x2)}`
  };
}

// ─── Inequality ───────────────────────────────────────────────────────────────
function solveInequality(raw) {
  let s = raw.replace(/\s/g,'');
  const ops = ['<=','>=','<','>'];
  let op = '', sides;
  for (const o of ops) {
    if (s.includes(o)) { op = o; sides = s.split(o); break; }
  }
  if (!op) throw new Error('No inequality operator found');

  const L = parseLinear(sides[0]), R = parseLinear(sides[1]);
  let a = L.a - R.a, b = R.b - L.b;
  let resultOp = op;

  // if dividing by negative, flip
  if (a < 0) {
    a = -a; b = -b;
    const flip = {'<':'>','>':'<','<=':'>=','>=':'<='};
    resultOp = flip[op] || op;
  }

  const x = b / a;
  const steps = [
    `Start with: <span class="step-math">${raw}</span>`,
    `Move x terms left, constants right`,
    `<span class="step-math">${fmtNum(L.a-R.a)}x ${(R.b-L.b)>=0?'+':''} ${fmtNum(R.b-L.b)} ... wait, isolate x</span>`,
    `Coefficient of x: <span class="step-math">${fmtNum(L.a-R.a)}</span> — divide both sides`,
    `${(L.a-R.a)<0?'⚠️ Dividing by negative → flip inequality sign':''}`,
    `Result: <span class="step-math">x ${resultOp} ${fmtNum(x)}</span>`,
  ].filter(s=>s);

  const intervalMap = {'<':'(−∞, ','>':`(${fmtNum(x)}, +∞)`,'<=':'(−∞, ','>=': `[${fmtNum(x)}, +∞)`};
  const bracket = op === '<' ? ')' : op === '<=' ? ']' : '';
  const interval = op === '>' ? `(${fmtNum(x)}, +∞)` : op === '>=' ? `[${fmtNum(x)}, +∞)` :
    op === '<' ? `(−∞, ${fmtNum(x)})` : `(−∞, ${fmtNum(x)}]`;

  return {
    type: 'Inequality',
    steps,
    answer: `x ${resultOp} ${fmtNum(x)}  |  Interval: ${interval}`
  };
}

// ─── Square Root equation ─────────────────────────────────────────────────────
function solveSqrt(raw) {
  const s = raw.replace(/\s/g,'');
  const m = s.match(/[√]?\s*(?:sqrt\()?([\d.]*x?[+\-\d.]*)\)?\s*=\s*([+\-\d.]+)/i);
  if (!m) throw new Error('Could not parse square root equation');
  const inner = m[1], rhs = parseFloat(m[2]);
  const rhs2 = rhs*rhs;
  const steps = [
    `Start with: <span class="step-math">${raw}</span>`,
    `Square both sides to eliminate the square root`,
    `<span class="step-math">${inner} = ${fmtNum(rhs2)}</span>`,
  ];
  const eq2 = `${inner}=${fmtNum(rhs2)}`;
  const res = solveLinear(eq2);
  const xVal = parseFloat(res.answer.replace('x=','').replace('x =',''));
  steps.push(...res.steps.slice(1));
  steps.push(`Verify: √(${inner.replace('x',fmtNum(xVal))}) = √${fmtNum(rhs2)} = ${fmtNum(Math.sqrt(rhs2))}`);
  return { type: 'Square Root Equation', steps, answer: res.answer };
}

// ─── System of equations ──────────────────────────────────────────────────────
function solveSystem(raw) {
  const eqs = raw.split(/[,;\n]/).map(e=>e.trim()).filter(Boolean);
  if (eqs.length < 2) throw new Error('Need two equations');

  // Parse each eq as ax + by = c  (simple 2-var only)
  function parseSysEq(eq) {
    const sides = eq.split('=');
    const lhs = sides[0], rhs = sides[1];
    let ax=0, by=0;
    const terms = lhs.match(/[+-]?[^+-]+/g)||[];
    terms.forEach(t=>{
      t=t.trim();
      if (!t) return;
      if (/x/.test(t)) { const c=t.replace('x',''); ax+=c===''||c==='+'?1:c==='-'?-1:parseFloat(c)||0; }
      else if (/y/.test(t)) { const c=t.replace('y',''); by+=c===''||c==='+'?1:c==='-'?-1:parseFloat(c)||0; }
    });
    const c = parseFloat(rhs)||0;
    return {ax, by, c};
  }

  const e1 = parseSysEq(eqs[0]), e2 = parseSysEq(eqs[1]);
  const det = e1.ax*e2.by - e2.ax*e1.by;
  if (Math.abs(det) < 1e-10) {
    return { type: 'System of Equations', steps: ['The system has no unique solution (parallel or same lines).'], answer: 'No unique solution' };
  }
  const x = (e1.c*e2.by - e2.c*e1.by)/det;
  const y = (e1.ax*e2.c - e2.ax*e1.c)/det;

  const steps = [
    `Equation 1: <span class="step-math">${eqs[0]}</span>`,
    `Equation 2: <span class="step-math">${eqs[1]}</span>`,
    `Use elimination method. Multiply equations to match coefficients.`,
    `Determinant: <span class="step-math">D = ${fmtNum(e1.ax)}×${fmtNum(e2.by)} − ${fmtNum(e2.ax)}×${fmtNum(e1.by)} = ${fmtNum(det)}</span>`,
    `<span class="step-math">x = (${fmtNum(e1.c)}×${fmtNum(e2.by)} − ${fmtNum(e2.c)}×${fmtNum(e1.by)}) / ${fmtNum(det)} = ${fmtNum(x)}</span>`,
    `<span class="step-math">y = (${fmtNum(e1.ax)}×${fmtNum(e2.c)} − ${fmtNum(e2.ax)}×${fmtNum(e1.c)}) / ${fmtNum(det)} = ${fmtNum(y)}</span>`,
    `Verify in Eq 1: ${fmtNum(e1.ax)}(${fmtNum(x)}) + ${fmtNum(e1.by)}(${fmtNum(y)}) = ${fmtNum(e1.ax*x+e1.by*y)} ✓`,
  ];
  return { type: 'System of Equations', steps, answer: `x = ${fmtNum(x)},  y = ${fmtNum(y)}` };
}

// ─── Numeric eval ─────────────────────────────────────────────────────────────
function evaluateExpression(raw) {
  const result = evalMath(raw);
  return {
    type: 'Expression',
    steps: [
      `Evaluate: <span class="step-math">${raw}</span>`,
      `Apply order of operations (PEMDAS)`,
      `Result: <span class="step-math">${fmtNum(result)}</span>`,
    ],
    answer: fmtNum(result)
  };
}

function evaluateNumeric(raw) {
  const sides = raw.split('=');
  const L = evalMath(sides[0]), R = evalMath(sides[1]);
  return {
    type: 'Numeric Check',
    steps: [
      `Left side: <span class="step-math">${fmtNum(L)}</span>`,
      `Right side: <span class="step-math">${fmtNum(R)}</span>`,
      Math.abs(L-R) < 1e-9 ? '✓ Both sides are equal — statement is TRUE.' : '✗ Sides are not equal — statement is FALSE.'
    ],
    answer: Math.abs(L-R) < 1e-9 ? 'TRUE' : 'FALSE'
  };
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal(eq) {
  selectedModalOptions.clear();
  document.querySelectorAll('.option-check').forEach(el => el.classList.remove('selected'));
  document.getElementById('modal-eq-preview').textContent = eq;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('placeholder').style.display = 'block';
}

function solveWithChoices() {
  if (selectedModalOptions.size === 0) {
    alert('Please select at least one option.');
    return;
  }
  closeModal();
  showSpinner();
  setTimeout(() => {
    const results = [];
    if (selectedModalOptions.has('solve')) {
      try { results.push(solveAuto(currentInput)); } catch(e) {}
    }
    if (selectedModalOptions.has('factor')) {
      results.push(factorExpression(currentInput));
    }
    if (selectedModalOptions.has('expand')) {
      results.push(expandExpression(currentInput));
    }
    if (selectedModalOptions.has('simplify')) {
      results.push(simplifyExpression(currentInput));
    }
    if (selectedModalOptions.has('evaluate')) {
      try { results.push(evaluateExpression(currentInput)); } catch(e) {}
    }
    if (selectedModalOptions.has('graph')) {
      results.push(slopeIntercept(currentInput));
    }
    if (selectedModalOptions.has('inequality')) {
      try { results.push(solveInequality(currentInput)); } catch(e) {}
    }
    if (selectedModalOptions.has('system')) {
      try { results.push(solveSystem(currentInput)); } catch(e) {}
    }

    if (results.length === 0) {
      showError('Could not solve with the selected options. Try rephrasing the problem.');
      return;
    }

    const combined = results[0];
    if (results.length > 1) {
      combined.steps = results.flatMap((r,i) => [
        `<strong>— ${r.type} —</strong>`,
        ...r.steps
      ]);
      combined.answer = results.map(r => `[${r.type}] ${r.answer}`).join('  |  ');
      combined.type = results.map(r=>r.type).join(' + ');
    }
    showResult(combined.type, combined.steps, combined.answer);
  }, 200);
}

function factorExpression(raw) {
  // Factor quadratic ax²+bx+c
  const s = raw.replace(/\s/g,'').replace(/²/g,'^2');
  const m = s.match(/([+-]?\d*)x\^?2([+-]\d*x)?([+-]\d+)?/);
  if (!m) return { type: 'Factor', steps: [`Could not factor: ${raw}`], answer: 'Not factorable' };
  const a = m[1]===''||m[1]===undefined?1:m[1]==='-'?-1:parseFloat(m[1]);
  const bStr = m[2]||'0'; const b = parseFloat(bStr.replace('x',''))||0;
  const c = parseFloat(m[3])||0;
  const disc = b*b-4*a*c;
  if (disc < 0) return { type: 'Factor', steps: ['Discriminant < 0 — cannot factor over reals'], answer: 'Not factorable over ℝ' };
  const r1 = (-b+Math.sqrt(disc))/(2*a), r2 = (-b-Math.sqrt(disc))/(2*a);
  return {
    type: 'Factor',
    steps: [
      `Expression: <span class="step-math">${raw}</span>`,
      `Find roots using quadratic formula`,
      `Roots: x = ${fmtNum(r1)},  x = ${fmtNum(r2)}`,
      `Factored form: <span class="step-math">${a===1?'':fmtNum(a)}(x − ${fmtNum(r1)})(x − ${fmtNum(r2)})</span>`,
    ],
    answer: `${a===1?'':fmtNum(a)}(x − ${fmtNum(r1)})(x − ${fmtNum(r2)})`
  };
}

function expandExpression(raw) {
  const expanded = expandParens(raw.replace(/\s/g,''));
  return {
    type: 'Expand',
    steps: [`Original: <span class="step-math">${raw}</span>`, `Distribute terms`, `Result: <span class="step-math">${expanded}</span>`],
    answer: expanded
  };
}

function simplifyExpression(raw) {
  try {
    const s = raw.replace(/\s/g,'');
    // If it has x, just clean it up
    if (/x/.test(s)) {
      return { type: 'Simplify', steps: [`Expression: <span class="step-math">${raw}</span>`, `Combine like terms`], answer: s };
    }
    const result = evalMath(s);
    return { type: 'Simplify', steps: [`Expression: <span class="step-math">${raw}</span>`, `Evaluate: <span class="step-math">${fmtNum(result)}</span>`], answer: fmtNum(result) };
  } catch(e) {
    return { type: 'Simplify', steps: ['Could not simplify.'], answer: 'See steps' };
  }
}

function slopeIntercept(raw) {
  // Try to extract y=mx+b or convert ax+by=c
  const s = raw.replace(/\s/g,'');
  const m = s.match(/y=([+-]?\d*\.?\d*)x([+-]\d+\.?\d*)?/);
  if (m) {
    const slope = parseFloat(m[1])||1;
    const intercept = parseFloat(m[2])||0;
    return {
      type: 'Slope-Intercept',
      steps: [
        `Equation: <span class="step-math">${raw}</span>`,
        `Already in y = mx + b form`,
        `Slope m = <span class="step-math">${fmtNum(slope)}</span>`,
        `y-intercept b = <span class="step-math">${fmtNum(intercept)}</span>`,
      ],
      answer: `slope = ${fmtNum(slope)},  y-intercept = ${fmtNum(intercept)}`
    };
  }
  // ax + by = c form
  const L = parseLinear(s.split('=')[0]||s);
  const c = parseFloat((s.split('=')||[])[1])||0;
  const slope = -L.a / (L.b||1);
  const intercept = c / (L.b||1);
  return {
    type: 'Slope-Intercept',
    steps: [
      `Equation: <span class="step-math">${raw}</span>`,
      `Solve for y: <span class="step-math">y = ${fmtNum(slope)}x + ${fmtNum(intercept)}</span>`,
      `Slope m = <span class="step-math">${fmtNum(slope)}</span>`,
      `y-intercept b = <span class="step-math">${fmtNum(intercept)}</span>`,
    ],
    answer: `slope = ${fmtNum(slope)},  y-intercept = ${fmtNum(intercept)}`
  };
}

// ─── History ──────────────────────────────────────────────────────────────────
function addHistory(eq, ans) {
  history.unshift({ eq, ans, ts: Date.now() });
  history = history.slice(0, 10);
  localStorage.setItem('alg1_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const section = document.getElementById('history-section');
  const list = document.getElementById('history-list');
  if (history.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  list.innerHTML = '';
  history.forEach(h => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `<span class="history-eq">${h.eq}</span><span class="history-ans">${h.ans}</span>`;
    item.onclick = () => {
      document.getElementById('eq-input').value = h.eq;
      handleSolve();
    };
    list.appendChild(item);
  });
}

function clearHistory() {
  history = [];
  localStorage.removeItem('alg1_history');
  renderHistory();
}

function copyAnswer() {
  const val = document.getElementById('answer-value').textContent;
  navigator.clipboard.writeText(val).then(() => {
    const btn = document.querySelector('.copy-answer-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Init history
renderHistory();
