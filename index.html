<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project V1 - Professional Edition</title>
    <style>
        :root {
            --neon-blue: #00e5ff;
            --bg-dark: #000b14;
            --panel-bg: rgba(0, 20, 40, 0.9);
        }
        body { 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        /* Glassmorphism UI */
        .game-wrapper { 
            position: relative; 
            padding: 20px;
            background: var(--panel-bg);
            border-radius: 20px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1);
        }
        canvas { 
            display: block; 
            background: #000; 
            border-radius: 10px;
            image-rendering: auto; /* Smoother edges */
        }
        #overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 10; text-align: center; border-radius: 10px;
            transition: opacity 0.3s;
        }
        .ui-icons { position: absolute; top: 30px; right: 30px; display: flex; gap: 15px; z-index: 20; }
        .icon { 
            background: rgba(0, 229, 255, 0.1); color: var(--neon-blue); 
            width: 40px; height: 40px; border-radius: 12px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; font-size: 20px; transition: 0.3s;
            border: 1px solid var(--neon-blue);
        }
        .icon:hover { background: var(--neon-blue); color: black; transform: translateY(-3px); }
        
        .stats-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            width: 100%; margin-top: 15px; padding: 0 5px;
        }
        .score-box { font-size: 24px; font-weight: bold; color: var(--neon-blue); letter-spacing: 1px; }
        
        .btn-group { display: flex; gap: 10px; }
        button { 
            padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; 
            font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        .btn-save { background: #00e676; color: #00331a; }
        .btn-load { background: #ffeb3b; color: #333300; }
        button:hover { opacity: 0.8; transform: scale(1.05); }

        /* Hidden File Input for Loading */
        #fileInput { display: none; }

        /* Menus */
        .menu { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: #001a33; border: 2px solid var(--neon-blue); padding: 25px; 
            display: none; z-index: 100; text-align: center; border-radius: 20px; width: 280px;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="ui-icons">
        <div class="icon" onclick="toggleMenu('modeMenu')">🌐</div>
        <div class="icon" onclick="toggleMenu('skinMenu')">🐍</div>
    </div>

    <div id="modeMenu" class="menu">
        <h2 style="color:var(--neon-blue)">SYSTEM MODES</h2>
        <button onclick="setMode('classic')" style="width:100%; margin-bottom:10px;">CLASSIC</button>
        <button onclick="setMode('ghost')" style="width:100%">GHOST (WRAP)</button>
        <br><br>
        <button onclick="toggleMenu('modeMenu')" style="background:#ff1744; color:white;">CLOSE</button>
    </div>

    <div id="skinMenu" class="menu">
        <h2 style="color:var(--neon-blue)">CORE SKINS</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button onclick="setSkin('#00e5ff')" style="background:#00e5ff">CYAN</button>
            <button onclick="setSkin('#ff1744')" style="background:#ff1744; color:white;">PULSE</button>
            <button onclick="setSkin('#00e676')" style="background:#00e676">LIME</button>
            <button onclick="setSkin('#ffeb3b')" style="background:#ffeb3b">GOLD</button>
        </div>
        <br>
        <button onclick="toggleMenu('skinMenu')" style="background:#ff1744; color:white;">CLOSE</button>
    </div>

    <div id="overlay" onclick="startGame()">
        <h1 style="color:var(--neon-blue); font-size: 40px; margin-bottom: 10px;">CYBER SNAKE</h1>
        <p style="letter-spacing: 3px; opacity: 0.8;">INITIALIZE SYSTEM</p>
    </div>
    
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    
    <div class="stats-bar">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="btn-group">
            <button class="btn-save" onclick="exportSave()">SAVE FILE</button>
            <button class="btn-load" onclick="document.getElementById('fileInput').click()">LOAD FILE</button>
        </div>
    </div>
</div>

<input type="file" id="fileInput" onchange="importSave(event)">

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const box = 25; // Larger blocks for a cleaner look
    
    let snake, food, d, score, game;
    let snakeColor = "#00e5ff";
    let gameMode = "classic";

    function toggleMenu(id) {
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function setSkin(color) {
        snakeColor = color;
        toggleMenu('skinMenu');
    }

    function setMode(mode) {
        gameMode = mode;
        toggleMenu('modeMenu');
        startGame();
    }

    function startGame() {
        document.getElementById("overlay").style.opacity = "0";
        setTimeout(() => document.getElementById("overlay").style.display = "none", 300);
        snake = [{ x: 9 * box, y: 10 * box }];
        spawnFood();
        score = 0;
        scoreEl.innerHTML = score;
        d = "RIGHT";
        if (game) clearInterval(game);
        game = setInterval(draw, 90); // Slightly faster for smoothness
    }

    function spawnFood() {
        food = { 
            x: Math.floor(Math.random() * 19) * box, 
            y: Math.floor(Math.random() * 19) * box 
        };
    }

    document.addEventListener("keydown", (e) => {
        if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(e.keyCode == 38 && d != "DOWN") d = "UP";
        else if(e.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(e.keyCode == 40 && d != "UP") d = "DOWN";
    });

    function draw() {
        // Subtle gradient background
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Snake with Rounded Edges
        for(let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "white" : snakeColor;
            // Rounded rectangle effect
            drawRoundedRect(ctx, snake[i].x + 1, snake[i].y + 1, box - 2, box - 2, 5);
        }

        // Draw Food with Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff1744";
        ctx.fillStyle = "#ff1744";
        drawRoundedRect(ctx, food.x + 4, food.y + 4, box - 8, box - 8, 10);
        ctx.shadowBlur = 0; // Reset glow for other elements

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        if(gameMode === "ghost") {
            if(snakeX < 0) snakeX = canvas.width - box;
            else if(snakeX >= canvas.width) snakeX = 0;
            if(snakeY < 0) snakeY = canvas.height - box;
            else if(snakeY >= canvas.height) snakeY = 0;
        }

        if(snakeX == food.x && snakeY == food.y) {
            score++;
            scoreEl.innerHTML = score;
            spawnFood();
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        if(gameMode === "classic") {
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                return gameOver();
            }
        } else if (collision(newHead, snake)) {
            return gameOver();
        }

        snake.unshift(newHead);
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fill();
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    function gameOver() {
        clearInterval(game);
        document.getElementById("overlay").style.display = "flex";
        document.getElementById("overlay").style.opacity = "1";
        document.querySelector("#overlay h1").innerHTML = "SYSTEM FAILURE";
        document.querySelector("#overlay p").innerHTML = "REBOOT (CLICK)";
    }

    // --- ENHANCED SAVING ---
    function exportSave() {
        const saveData = {
            score: score,
            skin: snakeColor,
            mode: gameMode,
            date: new Date().toLocaleString()
        };
        
        // 1. Save to Browser Memory
        localStorage.setItem("cyberSnake_pro_save", JSON.stringify(saveData));

        // 2. Download File to Windows
        const blob = new Blob([JSON.stringify(saveData, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `CyberSnake_Save_Score${score}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        alert("Progress Synced & Downloaded!");
    }

    function importSave(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = JSON.parse(e.target.result);
            score = data.score;
            snakeColor = data.skin;
            gameMode = data.mode;
            scoreEl.innerHTML = score;
            alert("System Restored from File!");
            startGame();
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
