<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project V1</title>
    <style>
        body { background: #001a33; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .game-wrapper { position: relative; border: 4px solid #00e5ff; box-shadow: 0 0 20px #00e5ff; }
        canvas { display: block; background: #000; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 10; }
        .ui-icons { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 20; }
        .icon { background: #00e5ff; color: #000; width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; }
        .stats { position: absolute; bottom: -50px; left: 0; width: 100%; display: flex; justify-content: space-between; font-size: 18px; color: #00e5ff; }
        .menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #001a33; border: 2px solid #00e5ff; padding: 20px; display: none; z-index: 100; text-align: center; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="ui-icons">
        <div class="icon" onclick="alert('Ghost Mode: Wrap through walls!')">🌐</div>
        <div class="icon" onclick="alert('Skins: Change your look!')">🐍</div>
    </div>
    <div id="overlay" onclick="startGame()">
        <h1>🐍 CYBER SNAKE</h1>
        <p>CLICK TO START</p>
        <p style="font-size: 12px;">(Use Arrow Keys to Move)</p>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="stats">
        <span>Score: <span id="score">0</span></span>
        <div>
            <button onclick="saveGame()">Save</button>
            <button onclick="loadGame()">Load</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const box = 20;
    let snake, food, d, score, game;

    function startGame() {
        document.getElementById("overlay").style.display = "none";
        snake = [{ x: 9 * box, y: 10 * box }];
        food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
        score = 0;
        d = "RIGHT";
        if (game) clearInterval(game);
        game = setInterval(draw, 100);
    }

    document.addEventListener("keydown", direction);
    function direction(event) {
        if(event.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(event.keyCode == 38 && d != "DOWN") d = "UP";
        else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    }

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "#00e5ff" : "white";
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
            ctx.strokeStyle = "black";
            ctx.strokeRect(snake[i].x, snake[i].y, box, box);
        }

        ctx.fillStyle = "#ff1744";
        ctx.fillRect(food.x, food.y, box, box);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        if(snakeX == food.x && snakeY == food.y) {
            score++;
            scoreEl.innerHTML = score;
            food = { x: Math.floor(Math.random() * 19 + 1) * box, y: Math.floor(Math.random() * 19 + 1) * box };
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
            clearInterval(game);
            document.getElementById("overlay").style.display = "flex";
            document.querySelector("#overlay h1").innerHTML = "GAME OVER";
        }

        snake.unshift(newHead);
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    function saveGame() {
        localStorage.setItem("snakeScore", score);
        alert("Progress Saved!");
    }

    function loadGame() {
        const savedScore = localStorage.getItem("snakeScore");
        if (savedScore) {
            score = parseInt(savedScore);
            scoreEl.innerHTML = score;
            alert("Loaded Score: " + savedScore);
        }
    }
</script>
</body>
</html>
