<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project V1</title>
    <style>
        body { background: #001a33; color: white; font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .game-wrapper { position: relative; border: 4px solid #00e5ff; box-shadow: 0 0 20px #00e5ff; }
        canvas { display: block; background: #000; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; z-index: 10; text-align: center; }
        .ui-icons { position: absolute; top: 10px; right: 10px; display: flex; gap: 10px; z-index: 20; }
        .icon { background: #00e5ff; color: #000; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 20px; transition: 0.2s; }
        .icon:hover { transform: scale(1.1); background: white; }
        .stats { position: absolute; bottom: -60px; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; color: #00e5ff; font-weight: bold; }
        
        /* Menu Styling */
        .menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #001a33; border: 3px solid #00e5ff; padding: 20px; display: none; z-index: 100; text-align: center; border-radius: 15px; width: 250px; }
        .menu h2 { margin-top: 0; font-size: 18px; color: #00e5ff; border-bottom: 1px solid #00e5ff; padding-bottom: 10px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .menu-btn { background: #00e5ff; color: #000; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .menu-btn:hover { background: white; }
        .close-btn { margin-top: 15px; background: #ff1744; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="ui-icons">
        <div class="icon" onclick="toggleMenu('modeMenu')">🌐</div>
        <div class="icon" onclick="toggleMenu('skinMenu')">🐍</div>
    </div>

    <div id="modeMenu" class="menu">
        <h2>GAME MODES</h2>
        <div class="menu-grid">
            <button class="menu-btn" onclick="setMode('classic')">CLASSIC</button>
            <button class="menu-btn" onclick="setMode('ghost')">GHOST (WRAP)</button>
        </div>
        <button class="close-btn" onclick="toggleMenu('modeMenu')">CLOSE</button>
    </div>

    <div id="skinMenu" class="menu">
        <h2>SELECT SKIN</h2>
        <div class="menu-grid">
            <button class="menu-btn" style="background:#00e5ff" onclick="setSkin('#00e5ff')">NEON</button>
            <button class="menu-btn" style="background:#00e676" onclick="setSkin('#00e676')">GREEN</button>
            <button class="menu-btn" style="background:#ffeb3b" onclick="setSkin('#ffeb3b')">GOLD</button>
            <button class="menu-btn" style="background:#d1c4e9" onclick="setSkin('#d1c4e9')">GHOST</button>
        </div>
        <button class="close-btn" onclick="toggleMenu('skinMenu')">CLOSE</button>
    </div>

    <div id="overlay" onclick="startGame()">
        <h1>🐍 CYBER SNAKE</h1>
        <p>CLICK TO START</p>
        <p style="font-size: 12px; opacity: 0.7;">(Arrows to Move)</p>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="stats">
        <span>SCORE: <span id="score">0</span></span>
        <div>
            <button onclick="saveGame()" style="background:#00e676; border:none; border-radius:3px; cursor:pointer; padding:5px 10px;">SAVE</button>
            <button onclick="loadGame()" style="background:#ffeb3b; border:none; border-radius:3px; cursor:pointer; padding:5px 10px;">LOAD</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const box = 20;
    
    let snake, food, d, score, game;
    let snakeColor = "#00e5ff";
    let gameMode = "classic"; // classic or ghost

    function toggleMenu(id) {
        const menu = document.getElementById(id);
        menu.style.display = (menu.style.display === "block") ? "none" : "block";
    }

    function setSkin(color) {
        snakeColor = color;
        toggleMenu('skinMenu');
    }

    function setMode(mode) {
        gameMode = mode;
        alert("Mode switched to: " + mode.toUpperCase());
        toggleMenu('modeMenu');
        startGame(); // Restart with new mode
    }

    function startGame() {
        document.getElementById("overlay").style.display = "none";
        document.querySelectorAll('.menu').forEach(m => m.style.display = 'none');
        snake = [{ x: 9 * box, y: 10 * box }];
        spawnFood();
        score = 0;
        scoreEl.innerHTML = score;
        d = "RIGHT";
        if (game) clearInterval(game);
        game = setInterval(draw, 100);
    }

    function spawnFood() {
        food = { 
            x: Math.floor(Math.random() * 19 + 1) * box, 
            y: Math.floor(Math.random() * 19 + 1) * box 
        };
    }

    document.addEventListener("keydown", (e) => {
        if(e.keyCode == 37 && d != "RIGHT") d = "LEFT";
        else if(e.keyCode == 38 && d != "DOWN") d = "UP";
        else if(event.keyCode == 39 && d != "LEFT") d = "RIGHT";
        else if(event.keyCode == 40 && d != "UP") d = "DOWN";
    });

    function draw() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for(let i = 0; i < snake.length; i++) {
            ctx.fillStyle = (i == 0) ? "white" : snakeColor;
            ctx.fillRect(snake[i].x, snake[i].y, box, box);
            ctx.strokeStyle = "black";
            ctx.strokeRect(snake[i].x, snake[i].y, box, box);
        }

        ctx.fillStyle = "#ff1744";
        ctx.fillRect(food.x, food.y, box, box);

        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if( d == "LEFT") snakeX -= box;
        if( d == "UP") snakeY -= box;
        if( d == "RIGHT") snakeX += box;
        if( d == "DOWN") snakeY += box;

        // Ghost Mode Logic
        if(gameMode === "ghost") {
            if(snakeX < 0) snakeX = canvas.width - box;
            else if(snakeX >= canvas.width) snakeX = 0;
            if(snakeY < 0) snakeY = canvas.height - box;
            else if(snakeY >= canvas.height) snakeY = 0;
        }

        if(snakeX == food.x && snakeY == food.y) {
            score++;
            scoreEl.innerHTML = score;
            spawnFood();
        } else {
            snake.pop();
        }

        let newHead = { x: snakeX, y: snakeY };

        // Game Over Logic
        if(gameMode === "classic") {
            if(snakeX < 0 || snakeX >= canvas.width || snakeY < 0 || snakeY >= canvas.height || collision(newHead, snake)) {
                return gameOver();
            }
        } else if (collision(newHead, snake)) {
            return gameOver();
        }

        snake.unshift(newHead);
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x == array[i].x && head.y == array[i].y) return true;
        }
        return false;
    }

    function gameOver() {
        clearInterval(game);
        document.getElementById("overlay").style.display = "flex";
        document.querySelector("#overlay h1").innerHTML = "GAME OVER";
        document.querySelector("#overlay p").innerHTML = "CLICK TO RESTART";
    }

    function saveGame() {
        localStorage.setItem("snakeScore", score);
        localStorage.setItem("snakeSkin", snakeColor);
        alert("Progress Saved!");
    }

    function loadGame() {
        const savedScore = localStorage.getItem("snakeScore");
        const savedSkin = localStorage.getItem("snakeSkin");
        if (savedScore !== null) {
            score = parseInt(savedScore);
            scoreEl.innerHTML = score;
            if(savedSkin) snakeColor = savedSkin;
            alert("Loaded Score: " + savedScore);
        }
    }
</script>
</body>
</html>
